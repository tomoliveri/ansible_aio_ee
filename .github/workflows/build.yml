---
name: build

# Kept cheap on purpose: the weekly job only checks for a new ansible release
# (~20s) and builds only when that changed something. Pushes/PRs lint + build only
# when EE inputs change; PRs build amd64 only.
on:
  push:
    branches: [main]
    paths:
      - execution-environment.yml
      - requirements.yml
      - requirements.txt
      - bindep.txt
      - tests/**
      - .ansible-lint
      - .yamllint
      - .github/workflows/build.yml
  pull_request:
    paths:
      - execution-environment.yml
      - requirements.yml
      - requirements.txt
      - bindep.txt
      - tests/**
      - .ansible-lint
      - .yamllint
      - .github/workflows/build.yml
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1" # weekly: auto-update to the latest ansible release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/tomoliveri/ansible_aio_ee
  # Publish only from main, and only once DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are set.
  PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != '' }}

jobs:
  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - name: Update to latest ansible release
        id: update
        run: |
          summary=$(python3 scripts/update-requirements.py)
          echo "$summary"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name tomoliveri
          git config user.email tomoliveri@gmail.com
          git commit -am "Update to ${summary%%:*}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  lint:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: yamllint + ansible-lint
        run: |
          pip install ansible-lint==26.9.0 yamllint==1.38.0
          yamllint .
          ansible-lint

  build:
    needs: [update, lint]
    # Runs after `update`/`lint` (or when skipped); scheduled runs build only if something changed.
    if: >-
      always() && needs.update.result != 'failure' && needs.lint.result != 'failure' &&
      (github.event_name != 'schedule' || needs.update.outputs.changed == 'true')
    strategy:
      fail-fast: true
      matrix:
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64","arm64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - name: Check Docker Hub login (fail fast before the long build)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if [ "$PUBLISH" != true ]; then echo "::error::DOCKERHUB_TOKEN secret is missing or empty"; exit 1; fi
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }} # picks up the commit pushed by `update`

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install ansible-builder==3.1.1
          ansible-builder build --container-runtime docker --tag ee:test -v 2

      - name: Smoke test
        run: |
          docker run --rm ee:test ansible --version
          docker run --rm ee:test ansible-runner --version
          if docker run --rm ee:test python3 -c "import requests" 2>&1 | grep RequestsDependencyWarning; then exit 1; fi
          docker run --rm -v "$PWD/tests:/tests:ro" ee:test ansible-playbook /tests/smoke.yml

      - name: Push arch image
        if: env.PUBLISH == 'true'
        run: |
          docker tag ee:test "$IMAGE:build-${{ github.run_id }}-${{ matrix.arch }}"
          docker push "$IMAGE:build-${{ github.run_id }}-${{ matrix.arch }}"

  publish:
    needs: build
    if: always() && needs.build.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        if: env.PUBLISH == 'true'
        with:
          ref: ${{ github.ref }}

      - name: Publish multi-arch manifest
        if: env.PUBLISH == 'true'
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          version=$(grep -oP 'org\.ansible\.version=\K[\w.]+' execution-environment.yml)
          docker buildx imagetools create \
            -t "$IMAGE:latest" -t "$IMAGE:$version" \
            "$IMAGE:build-${{ github.run_id }}-amd64" "$IMAGE:build-${{ github.run_id }}-arm64"
