name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *" # monthly rebuild to pick up base-image security fixes

env:
  IMAGE: docker.io/tomoliveri/ansible_aio_ee
  # Publish only from main, and only once DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are set.
  PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install ansible-builder==3.1.1
          ansible-builder build --container-runtime docker --tag ee:test -v 3

      - name: Smoke test
        run: |
          docker run --rm ee:test ansible --version
          docker run --rm ee:test ansible-runner --version
          docker run --rm ee:test ansible localhost -m ansible.builtin.ping
          docker run --rm ee:test python3 -c "import winrm, pypsrp, ldap, jmespath, netaddr, hvac, pynetbox, kubernetes, boto3"
          count=$(docker run --rm ee:test ansible-galaxy collection list --format json | python3 -c "import json,sys;print(sum(len(v) for v in json.load(sys.stdin).values()))")
          echo "collections installed: $count"
          test "$count" -ge 90

      - name: Push arch image
        if: env.PUBLISH == 'true'
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker tag ee:test "$IMAGE:build-${{ github.run_id }}-${{ matrix.arch }}"
          docker push "$IMAGE:build-${{ github.run_id }}-${{ matrix.arch }}"

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        if: env.PUBLISH == 'true'

      - name: Publish multi-arch manifest
        if: env.PUBLISH == 'true'
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          version=$(grep -oP 'org\.ansible\.version=\K[\w.]+' execution-environment.yml)
          docker buildx imagetools create \
            -t "$IMAGE:latest" -t "$IMAGE:$version" \
            "$IMAGE:build-${{ github.run_id }}-amd64" "$IMAGE:build-${{ github.run_id }}-arm64"
